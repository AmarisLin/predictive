<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101315"><meta name="description" content="聯想詞predictive"><title>聯想詞predictive</title><link rel="stylesheet" href="styles.css"><link rel="preload" as="image" href="assets/hallway-local.png"><link rel="preload" as="image" href="assets/hallway-sent.png"><script defer src="art.js"></script><script defer src="story.js"></script><script defer src="engine.js"></script><script defer src="branch.js"></script><script defer src="sound.js"></script><script defer src="game.js"></script></head><body>
<header class="site-header"><h1>聯想詞<span>predictive</span></h1></header>
<main><section class="device-area" aria-label="聊天手機"><div class="phone"><div class="phone-speaker" aria-hidden="true"></div><div class="phone-screen">
<div id="chat-screen" class="chat-screen"><div class="statusbar"><span id="phone-clock">02:31</span><span aria-hidden="true">▂▄▆ ◒ ▰</span></div><header id="chat-header" class="chat-header"><span class="back-mark" aria-hidden="true">‹</span><span id="contact-avatar" class="avatar">寧</span><div><b id="contact-name">阿寧</b><span id="contact-status">在線上</span></div><button id="keyboard-settings" aria-label="開啟鍵盤設定">···</button></header><div id="message-feed" class="message-feed" role="log" aria-live="polite" aria-label="聊天記錄"></div><div id="typing-indicator" class="typing-indicator" hidden>阿寧正在輸入 · · ·</div>

<div class="composer-area"><div class="input-row"><button id="attach" aria-label="附上照片" hidden>＋</button><textarea id="draft" tabindex="-1" readonly rows="1" maxlength="80" aria-label="訊息" placeholder="訊息"></textarea><button id="send" aria-label="送出訊息">↑</button></div><div class="keyboard-toolbar"><button hidden id="manual-input">手動輸入</button><span id="input-note" role="status"></span><button hidden id="clear-draft" aria-label="清空輸入文字">清空</button></div><div id="candidates" class="candidates" aria-label="聯想詞"></div><div id="reply-prompt" class="keyboard-reply" role="group" aria-label="鍵盤回覆字句"><span id="prompt-label" hidden>回覆朋友</span><p id="reply-text" class="sr-only"></p><div id="reply-actions"></div></div><div id="virtual-keyboard" class="virtual-keyboard" aria-hidden="true"></div><div class="keyboard-footer"><span>繁體中文</span><span>⌨</span></div></div></div>
<section id="lexicon-panel" class="lexicon-panel" role="dialog" aria-modal="true" aria-label="個人詞庫" hidden><header><button id="close-lexicon" aria-label="關閉詞庫">‹</button><h2>個人詞庫</h2></header><p id="lexicon-summary"></p><div id="lexicon-list" class="lexicon-list"></div><p id="clear-status" role="status"></p><button id="clear-lexicon" class="clear-lexicon">清除詞庫</button></section>
<div id="end-black" class="end-black" aria-label="黑屏" hidden></div>
<section id="morning-screen" class="morning-screen" aria-label="隔天早上" hidden><div class="morning-status"><span>▣</span><span>▂▄▆  ▰</span></div><p class="morning-date">早上</p><div class="morning-clock">07:12</div><div id="morning-notifications" class="morning-notifications"></div><button id="morning-settings" class="morning-settings" hidden>查看設定</button><div class="morning-home" aria-hidden="true"></div></section>
<section id="cloud-screen" class="cloud-screen" aria-label="輸入法帳號與同步" hidden><div class="cloud-status"><span>07:14</span><span>▂▄▆  ▰</span></div><header class="cloud-header"><button id="cloud-back" aria-label="返回輸入法設定">‹</button><h2 id="cloud-title">輸入法設定</h2></header><div id="cloud-body" class="cloud-body"></div><div class="morning-home" aria-hidden="true"></div></section><section id="battery-screen" class="battery-screen" aria-label="手機沒電" hidden><div class="empty-battery" aria-hidden="true"><span></span></div></section><div id="system-prompt" class="system-prompt" hidden></div><section id="branch-screen" class="branch-screen" hidden aria-label="結局分歧"></section><div id="cover" class="cover"><h2>聯想詞</h2><p class="sound-reminder">記得開啟聲音，體驗完整遊戲</p><button id="start" class="cover-button">開始</button><button id="tutorial-home" class="resume-button">遊玩教學</button><button id="sound-demo" class="resume-button">音效試聽</button><p id="ending-progress"></p><button id="ending-gallery" class="resume-button">結局紀錄</button><button id="resume" class="resume-button" hidden>繼續</button></div><div class="home-indicator" aria-hidden="true"></div></div></div></section></main>
<footer><div><button id="pace-toggle">訊息速度 正常</button><button id="restart">重新開始</button><button id="help">遊玩教學</button><button id="records">紀錄</button><button id="quit">暫停</button></div><div class="project-links"><a href="AGENTS.md" target="_blank" rel="noopener">AGENTS.md</a><a href="README.md" target="_blank" rel="noopener">README</a></div></footer>
<dialog id="settings-dialog"><button class="dialog-close" aria-label="關閉鍵盤設定">×</button><h2>鍵盤設定</h2><button id="view-lexicon" class="setting-action">個人詞庫</button><button id="prediction-toggle" class="setting-action" aria-pressed="true">一般聯想詞 開</button><div class="settings-links"><button id="view-photos" hidden>照片</button><button id="view-records">對話紀錄</button></div></dialog>
<dialog id="info-dialog"><button class="dialog-close" aria-label="關閉視窗">×</button><h2 id="dialog-title"></h2><div id="dialog-content"></div></dialog>
<dialog id="restart-dialog"><h2>重新開始？</h2><p>這輪聊天與詞庫會重新建立。</p><div class="dialog-actions"><button id="cancel-restart">取消</button><button id="confirm-restart">重新開始</button></div></dialog>
<dialog id="tutorial-dialog"><header><h2>遊玩教學</h2><span id="tutorial-count"></span><button id="tutorial-close" aria-label="關閉教學">×</button></header><div class="tutorial-stage"><div id="tutorial-example" hidden><p>聯想詞與字鍵：僅供顯示</p><div class="demo-candidates">他在打字　。　先這樣</div><p>手機功能：依劇情出現</p><div class="branch-choice">撥打語音電話</div><small>示意畫面，選項依劇情出現</small></div><div id="tutorial-frame"><img id="tutorial-image" alt="遊玩教學"><div id="tutorial-box"></div></div></div><p id="tutorial-label"></p><p id="tutorial-note"></p><nav><button id="tutorial-prev">上一步</button><button id="tutorial-next">下一步</button></nav></dialog></body></html>
